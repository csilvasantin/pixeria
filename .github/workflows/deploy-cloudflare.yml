# Publica pixeria.com en CLOUDFLARE PAGES (proyecto 'pixeria') en cada push a main.
# Espejo del deploy.sh local: git archive → wrangler pages deploy. El ORIGEN de
# producción es Cloudflare Pages (custom domain www.pixeria.com); el workflow de
# GitHub Pages queda como mirror.
#
# Requiere el secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables →
# Actions). Sin él, el job avisa y termina en verde sin desplegar — no rompe CI.
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar CLOUDFLARE_API_TOKEN
        id: tok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN no está configurado en los secrets del repo — deploy a Cloudflare Pages OMITIDO. Añádelo una vez y todos los merges se publicarán solos."
          fi

      - name: Deploy a Cloudflare Pages
        if: steps.tok.outputs.has == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TMP"
          # El deploy local escribe novedades en el artefacto. Este flujo es el que
          # queda en producción (corre después del push), así que tiene que hacer lo mismo.
          release="$(sed -n 's/.*admiranext-version.*content="[^"]*\(v\.[^"]*\)".*/\1/p' index.html | head -1)"
          deployer="$(jq -r '.deployer // .agent // empty' release-signature.json)"
          machine="$(jq -r '.machine // empty' release-signature.json)"
          test -n "$release"
          novedades='[]'
          if [ -f novedades.json ]; then
            novedades="$(jq -c --arg v "$release" '(if type=="object" then (.[$v] // .default // .novedades // []) elif type=="array" then . else [] end) | if type=="array" then . else [] end | map(tostring) | map(select(length>0)) | .[0:4]' novedades.json 2>/dev/null || echo '[]')"
          fi
          [ -n "$novedades" ] || novedades='[]'
          jq -n --argjson novedades "$novedades" \
            --arg version "$release" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployer "$deployer" \
            --arg machine "$machine" \
            --arg signature "$deployer · $machine" \
            --arg git "$GITHUB_SHA" \
            '{version:$version,deployedAt:$deployedAt,deployer:$deployer,machine:$machine,signature:$signature,git:$git,gitShort:($git[0:7]),gitFull:$git,dirty:false,novedades:$novedades}' \
            > "$TMP/version.json"
          npx --yes wrangler@latest pages deploy "$TMP" --project-name pixeria --branch main
          echo "✓ https://www.pixeria.com (Cloudflare Pages) · mirror https://pixeria.pages.dev"
