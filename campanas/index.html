  <style>
    .campaign-page{width:min(1440px,calc(100% - 48px));margin:0 auto;padding:54px 0 90px}.campaign-head{margin-bottom:30px}.campaign-head .eyebrow{color:var(--matrix);font-weight:800;letter-spacing:.09em}.campaign-head h1{font-size:clamp(42px,7vw,84px);line-height:.94;margin:12px 0 18px;color:var(--matrix);text-shadow:var(--glow)}.campaign-head p{max-width:900px;color:var(--muted);font-size:17px}.campaign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}.campaign-card{display:flex;flex-direction:column;border:1px solid var(--line-bright);border-radius:14px;background:rgba(3,12,5,.88);overflow:hidden;transition:.18s}.campaign-card:hover{border-color:var(--matrix);box-shadow:var(--glow);transform:translateY(-2px)}.campaign-preview{display:block;position:relative;aspect-ratio:16/9;background:#050905}.campaign-preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.campaign-preview::after{content:'▶ VER BUCLE';position:absolute;right:12px;bottom:12px;background:var(--matrix);color:#020602;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:900}.campaign-body{display:grid;gap:11px;padding:17px}.campaign-body h2{margin:0;color:var(--matrix);font-size:19px}.campaign-tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.campaign-tag{border:1px solid #aa88ff;color:#e6dcff;background:#aa88ff20;border-radius:999px;padding:3px 9px;font-size:11px}.campaign-target,.campaign-meta{color:var(--muted);font-size:11px}.campaign-items{list-style:none;margin:0;padding:0;display:grid;gap:5px}.campaign-items a{color:var(--matrix);text-decoration:none}.campaign-items a:hover{text-decoration:underline}.campaign-seg{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}.campaign-actions{display:flex;gap:12px;align-items:center}.campaign-open{display:inline-flex;background:var(--matrix);color:#020602;text-decoration:none;padding:10px 15px;border-radius:7px;font-weight:900}.campaign-empty{padding:30px;border:1px dashed var(--line-bright);color:var(--muted)}@media(max-width:640px){.campaign-page{width:min(100% - 24px,1440px);padding-top:30px}.campaign-grid{grid-template-columns:1fr}}

  <main class="campaign-page">
    <header class="campaign-head"><p class="eyebrow">// CATEGORÍA PIXERIA</p><h1>📣 Campañas · <span id="campaignCount">…</span></h1><p>Conjuntos de creatividades creados desde cero, empaquetados con sus metatags y preparados para distribuirse a Xtanco, kioskos y circuitos.</p></header>

  </main>
  <script defer src="/matrix-rain.js?v=20260608-sides"></script>
  <script>
  (async()=>{const grid=document.getElementById('campaignGrid'),count=document.getElementById('campaignCount'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),seg=s=>s?Object.entries(s).map(([k,v])=>`${k}: ${v}`).join(' · '):'';try{const idx=await fetch('/campanas/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status));const ids=Array.isArray(idx.campaigns)?idx.campaigns:[];const feeds=(await Promise.allSettled(ids.map(id=>fetch(`/campanas/${encodeURIComponent(id)}/feed.json`,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(f=>f&&({id,...f}))))).filter(r=>r.status==='fulfilled'&&r.value).map(r=>r.value);count.textContent=feeds.length;if(!feeds.length){grid.innerHTML='<p class="campaign-empty">// todavía no hay campañas publicadas.</p>';return}grid.innerHTML=feeds.map(c=>{const base=`/campanas/${encodeURIComponent(c.id)}/`,player=base+(c.player||'bucle.html'),tags=(c.tags||[]).map(t=>`<span class="campaign-tag">#${esc(t)}</span>`).join(''),items=(c.items||[]).map(it=>`<li><a href="${esc(base+it.url)}" target="_blank" rel="noopener">${esc(it.title||it.id)}</a>${it.segment?` <span class="campaign-seg">${esc(seg(it.segment))}</span>`:''}</li>`).join(''),meta=[`${(c.items||[]).length} piezas`,c.dwell_ms?Math.round(c.dwell_ms/1000)+' s/pieza':'',c.updatedAt||''].filter(Boolean).join(' · ');return `<article class="campaign-card"><a class="campaign-preview" href="${esc(player)}" target="_blank" rel="noopener"><iframe src="${esc(player)}" loading="lazy" tabindex="-1" title="Previo ${esc(c.title||c.id)}"></iframe></a><div class="campaign-body"><h2>${esc(c.title||c.id)}</h2><div class="campaign-tags">${tags}${c.target?`<span class="campaign-target">→ ${esc(c.target)}</span>`:''}</div><ul class="campaign-items">${items}</ul><div class="campaign-actions"><a class="campaign-open" href="${esc(player)}" target="_blank" rel="noopener">▶ Ver bucle</a><span class="campaign-meta">${esc(meta)}</span></div></div></article>`}).join('')}catch(e){count.textContent='0';grid.innerHTML='<p class="campaign-empty">// no se pudieron cargar las campañas.</p>'}})();
  </script>
