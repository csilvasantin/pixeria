<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Bucle ¿Sabías que? · Pantalla Xtanco</title>
<meta name="description" content="Reproductor en bucle de la serie ¿Sabías que? del tabaco para la pantalla del Xtanco.">
<meta name="pixer-tags" content="sabiasqueXtanco">
<meta name="pixer-campaign" content="sabiasque-tabaco">
<meta name="pixer-kind" content="loop">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#2a0a0c}
  #wrap{position:fixed;inset:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
    opacity:0;transition:opacity .8s ease}
  iframe.show{opacity:1}
</style>
  <!-- Medición sin interfaz: este reproductor hereda el consentimiento del sitio. -->
  <script defer src="/assets/analytics.js?v=20260714-coverage"></script>
</head>
<body>
<div id="wrap">
  <iframe id="a" title="slide a"></iframe>
  <iframe id="b" title="slide b"></iframe>
</div>
<script>
/* Bucle de la serie: 5 contenidos segmentados, metatag sabiasqueXtanco.
   Rota con crossfade y recarga cada iframe para relanzar la animación. */
const TOTAL   = 5;
const SRC     = 'slide.html';
// permite override por query: ?dwell=10000&loc=Barcelona
const Q       = new URLSearchParams(location.search);
const DWELL   = parseInt(Q.get('dwell')||'8000',10) || 8000;   // ms por contenido
const LOC     = (Q.get('loc')||'').trim();

let idx = 0;
const frames = [document.getElementById('a'), document.getElementById('b')];
let front = 0;

function urlFor(n){
  let u = `${SRC}?i=${n}&dwell=${DWELL}`;
  if(LOC) u += `&loc=${encodeURIComponent(LOC)}`;
  return u;
}

function next(){
  idx = (idx % TOTAL) + 1;            // 1..TOTAL en bucle
  const back = frames[front ^ 1];
  back.onload = () => {
    back.classList.add('show');
    frames[front].classList.remove('show');
    front ^= 1;
  };
  back.src = urlFor(idx);
}

// arranque: primer contenido visible ya, luego rotación
frames[0].onload = () => frames[0].classList.add('show');
frames[0].src = urlFor(1);
idx = 1;
setInterval(next, DWELL);

// mantener despierta la pantalla si el navegador lo permite
if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(()=>{}); }
</script>
</body>
</html>
