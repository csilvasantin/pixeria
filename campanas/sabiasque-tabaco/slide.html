<meta name="description" content="Serie de contenidos ¿Sabías que? sobre el estanco y el tabaco para pantalla de Xtanco.">
<!-- === METATAG DE DISTRIBUCIÓN AUTOMÁTICA A LOS XTANCOS === -->
<meta name="pixer-tags" content="sabiasqueXtanco">
<meta name="pixer-campaign" content="sabiasque-tabaco">
<meta name="pixer-kind" content="slide">
<style>
  :root{
    --oxblood:#5e141a; --oxblood-deep:#2a0a0c; --gold:#e4b341; --gold-soft:#f1cf7a;
    --cream:#f6ece0; --cream-dim:rgba(246,236,224,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--oxblood-deep);
    font-family:"Georgia","Times New Roman",serif;color:var(--cream)}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;
    background:
      radial-gradient(120% 90% at 78% 12%, rgba(228,179,65,.16), transparent 55%),
      radial-gradient(140% 120% at 20% 110%, #4a0f14 0%, var(--oxblood-deep) 70%),
      linear-gradient(160deg, var(--oxblood) 0%, var(--oxblood-deep) 90%);
  }
  /* grain + vignette */
  #stage::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    box-shadow:inset 0 0 240px rgba(0,0,0,.7);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/></svg>");}
  /* estanco "T" watermark */
  .t-mark{position:absolute;right:-4vw;top:50%;translate:0 -50%;z-index:1;
    font-family:"Georgia",serif;font-weight:700;font-size:78vh;line-height:.8;
    color:var(--gold);opacity:.08;letter-spacing:-.04em;
    animation:kb 22s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.08) rotate(1.5deg)}}

  /* top progress bar (llena durante el dwell) */
  #bar{position:absolute;top:0;left:0;height:5px;width:0;z-index:30;
    background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    box-shadow:0 0 14px rgba(228,179,65,.7)}

  header{position:relative;z-index:20;display:flex;justify-content:space-between;
    align-items:center;padding:clamp(18px,3.2vh,40px) clamp(28px,4vw,72px)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .tile{width:clamp(34px,4.4vh,54px);height:clamp(34px,4.4vh,54px);
    display:grid;place-items:center;border-radius:10px;
    background:linear-gradient(160deg,var(--gold),#b8862a);
    color:var(--oxblood-deep);font-weight:700;font-size:clamp(22px,3vh,34px);
    box-shadow:0 6px 22px rgba(0,0,0,.35)}
  .brand .wm{font-family:Arial,Helvetica,sans-serif;font-weight:800;
    letter-spacing:.42em;font-size:clamp(13px,1.7vh,18px);color:var(--cream)}
  .brand .wm small{display:block;letter-spacing:.28em;font-weight:600;
    font-size:.62em;color:var(--gold-soft);margin-top:3px}
  .seg{display:flex;align-items:center;gap:14px;font-family:Arial,Helvetica,sans-serif}
  .badge{border:1px solid rgba(228,179,65,.5);border-radius:999px;
    padding:8px 18px;font-size:clamp(11px,1.5vh,15px);letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold-soft);background:rgba(228,179,65,.06)}
  .live{display:flex;align-items:center;gap:8px;font-size:clamp(10px,1.3vh,13px);
    letter-spacing:.2em;text-transform:uppercase;color:var(--cream-dim)}
  .live b{width:9px;height:9px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px var(--gold);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}

  main{position:relative;z-index:20;flex:1;display:flex;flex-direction:column;
    justify-content:center;padding:0 clamp(28px,7vw,120px)}
  .kicker{font-family:Arial,Helvetica,sans-serif;font-weight:800;
    letter-spacing:.5em;text-transform:uppercase;color:var(--gold);
    font-size:clamp(14px,2.2vh,24px);margin-bottom:clamp(14px,2.4vh,30px)}
  .fact{font-weight:700;line-height:1.04;letter-spacing:-.015em;
    font-size:clamp(38px,8.2vh,104px);max-width:16ch;text-wrap:balance;
    text-shadow:0 4px 30px rgba(0,0,0,.4)}
  .fact em{color:var(--gold-soft);font-style:italic}
  .sub{margin-top:clamp(18px,3.2vh,42px);max-width:44ch;
    font-size:clamp(17px,2.5vh,30px);line-height:1.45;color:var(--cream-dim);
    border-left:3px solid var(--gold);padding-left:clamp(16px,1.8vw,26px)}

  footer{position:relative;z-index:20;display:flex;justify-content:space-between;
    align-items:flex-end;padding:clamp(18px,3.2vh,40px) clamp(28px,4vw,72px);
    font-family:Arial,Helvetica,sans-serif}
  .tag{display:inline-flex;align-items:center;gap:9px;font-size:clamp(11px,1.5vh,15px);
    letter-spacing:.06em;color:var(--gold-soft)}
  .tag .hash{background:rgba(228,179,65,.12);border:1px solid rgba(228,179,65,.35);
    border-radius:6px;padding:5px 11px;font-weight:700}
  .tag small{display:block;color:var(--cream-dim);letter-spacing:.14em;
    text-transform:uppercase;font-size:.78em;margin-top:5px}
  .dots{display:flex;gap:10px}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(246,236,224,.22)}
  .dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.15)}

  /* entrada */
  .anim{opacity:0;transform:translateY(26px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.12s}.d2{animation-delay:.30s}.d3{animation-delay:.5s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ember/glow inferior (ambiente estanco) */
  .ember{position:absolute;left:0;right:0;bottom:0;height:34vh;z-index:1;pointer-events:none;
    background:radial-gradient(80% 120% at 22% 130%, rgba(228,179,65,.14), transparent 70%)}

  @media (max-aspect-ratio:3/4){ /* vertical / tótem Xtanco (LED vertical) */
    main{justify-content:center;padding:0 clamp(26px,8vw,60px)}
    .fact{font-size:clamp(40px,6vh,82px);max-width:13ch}
    .sub{font-size:clamp(19px,2.4vh,30px);max-width:26ch}
    .kicker{letter-spacing:.42em;font-size:clamp(15px,2vh,22px)}
    .t-mark{font-size:46vh;right:auto;left:50%;top:30%;translate:-50% -50%;opacity:.06}
    header{flex-direction:column;gap:16px;align-items:flex-start}
    .seg{align-self:flex-start}
    footer{flex-direction:column;gap:18px;align-items:flex-start}
    .dots{align-self:center}
  }
</style>
  <!-- Medición sin interfaz: esta creatividad hereda el consentimiento del sitio. -->

<body>
<div id="stage">
  <div id="bar"></div>
  <div class="t-mark">T</div>
  <div class="ember"></div>

  <header>
    <div class="brand">
      <div class="tile">T</div>
      <div class="wm">XTANCO<small id="loc">RED PIXERIA</small></div>
    </div>
    <div class="seg">
      <div class="badge" id="badge">—</div>
      <div class="live"><b></b> en pantalla</div>
    </div>
  </header>

  <main>
    <div class="kicker anim">¿ Sabías que… ?</div>
    <h1 class="fact anim d1" id="fact"></h1>
    <p class="sub anim d2" id="sub"></p>
  </main>

  <footer>
    <div class="tag anim d3">
      <span class="hash">#sabiasqueXtanco</span>
      <span>Serie “Sabías que” del tabaco<small>Distribución automática · Pixeria</small></span>
    </div>
    <div class="dots" id="dots"></div>
  </footer>
</div>

<script>
/* === LOS 5 CONTENIDOS SEGMENTADOS ===================================
   Cada uno es una pieza autónoma, direccionable por slide.html?i=N,
   y todos comparten el metatag de distribución: sabiasqueXtanco       */
const CONTENTS = [
  { // 1 · GÉNERO: HOMBRE
    seg:{ genero:'hombre' }, badge:'Para ellos',
    fact:'Tu estanco hereda un <em>privilegio real</em> de hace casi 400 años.',
    sub:'En España el tabaco fue monopolio de la Corona desde 1636. El estanco es, aún hoy, su red oficial de venta autorizada.'
  },
  { // 2 · GÉNERO: MUJER
    seg:{ genero:'mujer' }, badge:'Para ellas',
    fact:'Las <em>cigarreras</em> de Sevilla inspiraron a la Carmen de la ópera.',
    sub:'La Real Fábrica de Tabacos llegó a emplear a miles de mujeres. Su carácter y su leyenda dieron vida a la Carmen de Mérimée y Bizet.'
  },
  { // 3 · EDAD: JOVEN (enfoque servicio, no consumo)
    seg:{ edad:'joven' }, badge:'Generación joven',
    fact:'En el estanco hay <em>mucho más</em> que tabaco.',
    sub:'Sellos, cartas certificadas, lotería, recargas de transporte y trámites oficiales: tu estanco es un punto de servicio del Estado en tu barrio.'
  },
  { // 4 · EDAD: ADULTO
    seg:{ edad:'adulto' }, badge:'Público adulto',
    fact:'“Estanco” significa, literalmente, <em>“monopolizado”</em>.',
    sub:'Viene de “estancar”: retener en exclusiva. Hoy son unos 13.000 los estancos que forman esa red oficial repartida por toda España.'
  },
  { // 5 · EDAD: SENIOR
    seg:{ edad:'senior' }, badge:'Público sénior',
    fact:'El estanco de tu barrio es de los <em>comercios más longevos</em> de España.',
    sub:'Punto de encuentro de generaciones, muchos llevan décadas —a veces más de un siglo— en la misma esquina de siempre.'
  }
];

const qs = new URLSearchParams(location.search);
const total = CONTENTS.length;
let i = parseInt(qs.get('i')||'1',10); if(isNaN(i)||i<1||i>total) i=1;
const dwell = parseInt(qs.get('dwell')||'0',10); // ms; 0 = sin barra (modo standalone)
const c = CONTENTS[i-1];

document.getElementById('fact').innerHTML = c.fact;
document.getElementById('sub').textContent = c.sub;
document.getElementById('badge').textContent = c.badge;

// personalización por estanco: ?loc=Barcelona → "TU XTANCO · BARCELONA"
const loc = (qs.get('loc')||'').trim();
document.getElementById('loc').textContent = loc ? ('TU XTANCO · '+loc.toUpperCase()) : 'RED PIXERIA';

// dots
const dots = document.getElementById('dots');
for(let n=1;n<=total;n++){ const d=document.createElement('i'); if(n===i) d.className='on'; dots.appendChild(d); }

// barra de progreso sincronizada con el dwell del bucle
if(dwell>0){
  const bar=document.getElementById('bar');
  requestAnimationFrame(()=>{ bar.style.transition='width '+dwell+'ms linear'; bar.style.width='100%'; });
}

// expone metadatos al contenedor (bucle / worker de distribución)
window.PIXER_CONTENT = { index:i, total, tags:['sabiasqueXtanco'], campaign:'sabiasque-tabaco', target:'xtanco', loc:loc||null, segment:c.seg };
</script>
</body>
