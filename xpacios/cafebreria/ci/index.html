<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de la Cafebrería · Pixeria</title>
<meta name="robots" content="noindex">
<meta name="admiranext-version" content="Pixeria v.26.09.2026.r12.17:18">
<style>
body{margin:0;background:#142522;color:#f3f5e7;font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
a{color:#bdf7d5}
h1{font-size:clamp(28px,7vw,40px);line-height:1.1}
.luz{display:flex;justify-content:space-between;margin:8px 0;padding:10px 12px;border-radius:10px}
.verde{background:#14532d}.rojo{background:#7f1d1d}.ambar{background:#713f12}.apagado{background:#334155}
.accion{display:block;margin:16px 0;padding:14px;border-radius:10px;background:#ffd766;color:#142522;text-align:center;font-weight:700;text-decoration:none}
img{width:min(240px,70vw);height:auto;background:#fff;padding:8px;border-radius:8px}
dl{display:grid;grid-template-columns:8rem 1fr;gap:6px 10px}
dt{color:#c6d3cb}dd{margin:0}
</style>
</head>
<body>
<main id="ficha"><p>Cargando la ficha…</p></main>
<script type="module">
import {fichaDe, accion, semaforoEstado, semaforoGarantia, urlUnidad} from '/assets/xpaces/ci.mjs';
const params = new URL(location.href).searchParams;
const unidad = params.get('u') || '';
const root = document.getElementById('ficha');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const manifest = await fetch('/assets/xpaces/inventory/alsea-4380.json?v=ci-4442').then(r => r.json());
const row = manifest.items.find(item => item.id === unidad);
if (row && params.get('accion') === 'portal-iot') {
  const f = fichaDe(row);
  root.innerHTML = `<p><a href="${esc(urlUnidad(f.unidad))}">Volver a la ficha</a></p><h1>Portal IoT</h1><p>Destino provisional. ${esc(f.nombre)} todavía no tiene un portal conectado.</p><p class="luz ambar"><span>Estado del portal</span><b>Provisional</b></p>`;
} else if (!row) {
  root.innerHTML = '<h1>Sin esa unidad</h1><p>La dirección no corresponde a un elemento de la Cafebrería.</p>';
} else {
  const f = fichaDe(row), boton = accion(f), luz = (nombre, tono) => `<p class="luz ${tono}"><span>${nombre}</span><b>${tono === 'verde' ? 'En regla' : tono === 'rojo' ? 'Atención' : 'Pendiente'}</b></p>`;
  root.innerHTML = `<p><a href="/stock?highlight=${encodeURIComponent(manifest.modelo3d)}">Volver al modelo</a></p><h1>${esc(f.nombre)}</h1><p>${esc(f.id)}</p>${luz('Estado', semaforoEstado(f.estado))}${luz('Garantía', semaforoGarantia(f))}<dl><dt>Categoría</dt><dd>${esc(f.categoria)}</dd><dt>Fabricante</dt><dd>${esc(f.fabricante)}</dd><dt>Modelo</dt><dd>${esc(f.modelo)}</dd><dt>Nº de serie</dt><dd>${esc(f.serie)}</dd><dt>Compra</dt><dd>${esc(f.compra.fecha)} · ${esc(f.compra.proveedor)} · factura ${esc(f.compra.factura)}</dd><dt>Garantía</dt><dd>${esc(f.garantia.inicio)} → ${esc(f.garantia.fin)}</dd><dt>Ubicación</dt><dd>${esc(f.ubicacion)}</dd><dt>Responsable</dt><dd>${esc(f.responsable)}</dd>${f.red ? `<dt>Red</dt><dd>IP ${esc(f.red.ip)} · MAC ${esc(f.red.mac)} · firmware ${esc(f.red.firmware)}</dd>` : ''}</dl><a class="accion" href="${esc(boton.href)}">${esc(boton.etiqueta)}</a><p>Enlace provisional.</p><img alt="Código para pegar en el aparato" src="/assets/xpaces/inventory/qr/${encodeURI(f.unidad).replace(/:/g,'_')}.svg"><p>Dirección fija: <a href="${esc(urlUnidad(f.unidad))}">${esc(urlUnidad(f.unidad))}</a></p>`;
}
</script>
</body>
</html>
