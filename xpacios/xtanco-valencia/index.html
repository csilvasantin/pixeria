<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xtanco Valencia · Xpacio · XpaceOS Locations</title>
<meta name="theme-color" content="#04070d">
<meta name="description" content="Xtanco Valencia — gemelo isométrico del local con sus 4 zonas DOOH (A·B·C·D), generado desde el plano. XpaceOS Locations · Pixeria.">
<style>
  :root{ --bg:#04070d; --ink:#dceaff; --muted:#7d93b0; --cyan:#37e0ff; --line:rgba(55,224,255,.16); --panel:rgba(8,16,28,.82); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(130% 100% at 50% -10%,#0a1424,#04070d);color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;z-index:5}
  .top{top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px 18px;
    background:linear-gradient(180deg,rgba(4,7,13,.92),transparent);pointer-events:none}
  .top a,.top .brand{pointer-events:auto}
  .top .back{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .top .back:hover{border-color:var(--cyan);color:var(--ink)}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand b{font-weight:650;letter-spacing:.4px;font-size:16px}
  .brand .x{color:var(--cyan)}
  .brand small{color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .badge{font-size:10.5px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(55,224,255,.06)}
  /* panel de zonas */
  .zones{bottom:18px;left:18px;width:236px;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .zones h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .zrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.12s}
  .zrow:hover{background:rgba(55,224,255,.07)}
  .zrow .dot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
  .zrow .nm{font-weight:700;font-size:13px;flex:none;width:14px}
  .zrow .det{color:var(--muted);font-size:10.5px;line-height:1.3}
  .zrow .det b{color:var(--ink);font-weight:600}
  /* controles */
  .ctrl{bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .ctrl button{font-family:inherit;background:var(--panel);backdrop-filter:blur(10px);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .ctrl button:hover{border-color:var(--cyan)}
  .ctrl button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(55,224,255,.08)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;
    background:var(--bg);color:var(--muted);font-size:13px;letter-spacing:.1em}
  #loading .ring{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{bottom:2px;left:0;right:0;text-align:center;color:var(--muted);font-size:9.5px;opacity:.7;pointer-events:none}
  /* etiquetas flotantes de zona (HTML sobre el canvas) */
  .zlabel{position:fixed;z-index:4;transform:translate(-50%,-100%);pointer-events:none;
    background:rgba(4,7,13,.78);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11px;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .zlabel b{font-weight:700}
  .zlabel small{color:var(--muted)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div class="ring"></div><div>Construyendo Xtanco Valencia…</div></div>

<div class="hud top">
  <a class="back" href="/xpacios/" title="Volver a Xpacios">←</a>
  <div class="brand"><b>Xtanco <span class="x">Valencia</span></b> <small>· Xpacio · XpaceOS Locations</small></div>
  <span class="spacer"></span>
  <span class="badge">4 zonas DOOH · 280 cm · ~16 m² c/u</span>
</div>

<div class="hud zones" id="zones"><h3>Zonas / pantallas</h3></div>

<div class="hud ctrl">
  <button id="spinBtn" class="on" title="Rotación automática">↻ Auto-giro</button>
  <button id="screensBtn" class="on" title="Encender/apagar las pantallas">🖥️ Pantallas</button>
  <button id="resetBtn" title="Recentrar la cámara isométrica">📐 Isométrica</button>
</div>

<div class="hud foot">Pixeria · XpaceOS Locations · render interpretado del plano (v1) · cotas reales por zona</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
   MODELO DEL PLANO — Xtanco Valencia (editable / refinable)
   Coordenadas en METROS, planta vista desde arriba (x→este, z→sur).
   Las 4 zonas usan sus COTAS REALES (cm→m). El contorno es una
   interpretación del plano; se afina cuando llegue el DWG/SVG.
   ============================================================ */
const PLAN = {
  height: 2.8,                              // altura de pared (280 cm)
  // contorno exterior del local (polígono, en metros) — interpretado del plano
  outline: [
    [0.0, 5.5],[3.6, 5.5],[3.6, 1.2],[8.2, 1.2],[8.2, 0.0],[14.6, 0.0],
    [14.6, 2.0],[18.4, 2.0],[18.4, 9.2],[16.0, 14.4],[8.6, 14.4],[8.6, 10.2],
    [4.2, 10.2],[4.2, 7.2],[0.0, 7.2]
  ],
  // zonas DOOH — pos = esquina sup-izq en planta (m); w×d en metros (cotas reales)
  zones: [
    { id:"A", color:0xff9d6e, x:0.5,  z:7.2-5.0-0.0+2.2, w:3.22, d:5.00 },
    { id:"B", color:0xf2e08a, x:9.2,  z:1.2,             w:4.91, d:3.37 },
    { id:"C", color:0xb59cff, x:9.6,  z:6.6,             w:4.05, d:4.00 },
    { id:"D", color:0x88e6a8, x:13.7, z:9.9,             w:3.98, d:4.09 },
  ],
};
// pequeña corrección de A (la coloco a la izquierda, centrada en altura)
PLAN.zones[0].x = 0.5; PLAN.zones[0].z = 1.6;

/* ---------- escena ---------- */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x04070d, 28, 60);

// centro del plano (para centrar la cámara y el suelo)
const bb = PLAN.outline.reduce((a,[x,z])=>({minx:Math.min(a.minx,x),maxx:Math.max(a.maxx,x),minz:Math.min(a.minz,z),maxz:Math.max(a.maxz,z)}),{minx:1e9,maxx:-1e9,minz:1e9,maxz:-1e9});
const CX=(bb.minx+bb.maxx)/2, CZ=(bb.minz+bb.maxz)/2, SPAN=Math.max(bb.maxx-bb.minx, bb.maxz-bb.minz);
const root = new THREE.Group(); scene.add(root);
const toV = (x,z)=> new THREE.Vector3(x-CX, 0, z-CZ);   // planta→mundo (centrado)

/* cámara isométrica ortográfica */
let aspect = innerWidth/innerHeight;
const D = SPAN*0.62;
const cam = new THREE.OrthographicCamera(-D*aspect, D*aspect, D, -D, 0.1, 200);
function isoPose(){ cam.position.set(CX*0+22, 24, 22); cam.lookAt(0,0,0); }
isoPose();
const controls = new OrbitControls(cam, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.target.set(0,1.2,0); controls.maxPolarAngle = Math.PI*0.49; controls.minZoom=0.4; controls.maxZoom=3;
controls.update();

/* luces */
scene.add(new THREE.AmbientLight(0x2a3a55, 1.1));
const key = new THREE.DirectionalLight(0xbfe4ff, 1.5); key.position.set(14,26,8);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-SPAN; key.shadow.camera.right=SPAN; key.shadow.camera.top=SPAN; key.shadow.camera.bottom=-SPAN;
key.shadow.camera.near=1; key.shadow.camera.far=80; scene.add(key);
const rim = new THREE.DirectionalLight(0x37e0ff, .55); rim.position.set(-12,8,-10); scene.add(rim);

/* ---------- suelo (polígono del local) + cuadrícula ---------- */
const shape = new THREE.Shape(PLAN.outline.map(([x,z])=> new THREE.Vector2(x-CX, z-CZ)));
const floorGeo = new THREE.ShapeGeometry(shape);
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color:0x0a1626, roughness:.92, metalness:.05 }));
floor.rotation.x = -Math.PI/2; floor.position.y = 0; floor.receiveShadow = true; root.add(floor);
// borde luminoso del suelo
const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(PLAN.outline.map(([x,z])=> new THREE.Vector3(x-CX,0.02,z-CZ))),
  new THREE.LineBasicMaterial({ color:0x37e0ff, transparent:true, opacity:.5 }));
root.add(edge);
// rejilla técnica (clip al polígono vía stencil sería ideal; aquí una sutil global)
const grid = new THREE.GridHelper(SPAN*2, Math.round(SPAN*2), 0x16324a, 0x0e2236);
grid.position.y = 0.012; grid.material.transparent=true; grid.material.opacity=.5; root.add(grid);

/* ---------- paredes (extrusión del contorno) ---------- */
const wallMat = new THREE.MeshStandardMaterial({ color:0x16273f, roughness:.85, metalness:.1,
  transparent:true, opacity:.5, side:THREE.DoubleSide });
const pts = PLAN.outline;
for(let i=0;i<pts.length;i++){
  const a=pts[i], b=pts[(i+1)%pts.length];
  const ax=a[0]-CX, az=a[1]-CZ, bx=b[0]-CX, bz=b[1]-CZ;
  const len=Math.hypot(bx-ax, bz-az);
  const g=new THREE.PlaneGeometry(len, PLAN.height);
  const m=new THREE.Mesh(g, wallMat);
  m.position.set((ax+bx)/2, PLAN.height/2, (az+bz)/2);
  m.rotation.y = -Math.atan2(bz-az, bx-ax);
  m.castShadow=true; root.add(m);
  // remate superior luminoso
  const top=new THREE.Mesh(new THREE.BoxGeometry(len,0.04,0.04), new THREE.MeshBasicMaterial({color:0x37e0ff}));
  top.position.set((ax+bx)/2, PLAN.height, (az+bz)/2); top.rotation.y=m.rotation.y;
  top.material.transparent=true; top.material.opacity=.35; root.add(top);
}

/* ---------- zonas DOOH (volumen + suelo coloreado + pantalla emisiva) ---------- */
const screens = []; const zoneMeshes = [];
PLAN.zones.forEach(z=>{
  const col = new THREE.Color(z.color);
  const cx = (z.x + z.w/2) - CX, cz = (z.z + z.d/2) - CZ;
  // suelo coloreado de la zona
  const padGeo = new THREE.PlaneGeometry(z.w, z.d);
  const pad = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({ color:col, roughness:.6, metalness:.1, transparent:true, opacity:.32, emissive:col, emissiveIntensity:.25 }));
  pad.rotation.x=-Math.PI/2; pad.position.set(cx,0.03,cz); pad.receiveShadow=true; root.add(pad);
  // contorno del volumen (caja wireframe a 2.8m)
  const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(z.w, PLAN.height, z.d)),
    new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:.55 }));
  box.position.set(cx, PLAN.height/2, cz); root.add(box);
  // PANTALLA: un panel emisivo vertical en la zona (mirando al centro del local)
  const sW=Math.min(z.w,z.d)*0.78, sH=1.5;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(sW, sH),
    new THREE.MeshStandardMaterial({ color:0x05131f, emissive:col, emissiveIntensity:1.1, roughness:.3, metalness:.4, side:THREE.DoubleSide }));
  // orientar la pantalla hacia el centro del local
  const toCenter = new THREE.Vector3(-cx,0,-cz).normalize();
  scr.position.set(cx + toCenter.x*(z.w*0.0), sH/2+0.25, cz + toCenter.z*(z.d*0.0));
  scr.lookAt(0, sH/2+0.25, 0);
  scr.userData.col = col; root.add(scr); screens.push(scr);
  // marco de la pantalla
  const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(sW+0.06,sH+0.06)),
    new THREE.LineBasicMaterial({color:col})); frame.position.copy(scr.position); frame.quaternion.copy(scr.quaternion); root.add(frame);
  // luz puntual tenue de la pantalla
  const pl=new THREE.PointLight(col, 0.9, 6); pl.position.set(cx, 1.8, cz); root.add(pl);
  z._world={cx,cz}; zoneMeshes.push({z,box,pad,scr,frame,pl});
});

/* ---------- panel de zonas (HTML) ---------- */
const zonesEl=document.getElementById("zones");
PLAN.zones.forEach(z=>{
  const r=document.createElement("div"); r.className="zrow";
  r.innerHTML=`<span class="dot" style="color:#${z.color.toString(16).padStart(6,'0')};background:#${z.color.toString(16).padStart(6,'0')}"></span>`+
    `<span class="nm">${z.id}</span>`+
    `<span class="det">Zona ${z.id} · <b>${(z.w*z.d).toFixed(0)} m²</b><br>${(z.w*100|0)}×${(z.d*100|0)} cm · h 280</span>`;
  r.addEventListener("click",()=>{ // enfocar la zona
    controls.target.set(z._world.cx, 1.2, z._world.cz); controls.update();
  });
  zonesEl.appendChild(r);
});

/* ---------- etiquetas flotantes A/B/C/D ---------- */
const labels = PLAN.zones.map(z=>{ const el=document.createElement("div"); el.className="zlabel";
  el.innerHTML=`<b>${z.id}</b> <small>${(z.w*z.d).toFixed(0)} m²</small>`; document.body.appendChild(el); return {z,el}; });
function updateLabels(){
  labels.forEach(({z,el})=>{
    const v=new THREE.Vector3(z._world.cx, PLAN.height+0.2, z._world.cz);
    v.applyMatrix4(root.matrixWorld);   // sigue la rotación del grupo
    v.project(cam);
    el.style.left=(v.x*0.5+0.5)*innerWidth+"px"; el.style.top=(-v.y*0.5+0.5)*innerHeight+"px";
    el.style.display=(v.z<1)?"block":"none";
  });
}

/* ---------- controles UI ---------- */
let spin=true, screensOn=true;
const spinBtn=document.getElementById("spinBtn"), screensBtn=document.getElementById("screensBtn"), resetBtn=document.getElementById("resetBtn");
spinBtn.onclick=()=>{ spin=!spin; spinBtn.classList.toggle("on",spin); };
screensBtn.onclick=()=>{ screensOn=!screensOn; screensBtn.classList.toggle("on",screensOn);
  screens.forEach(s=>{ s.material.emissiveIntensity = screensOn?1.1:0.04; });
  zoneMeshes.forEach(m=>{ m.pl.intensity = screensOn?0.9:0; });
};
resetBtn.onclick=()=>{ controls.target.set(0,1.2,0); isoPose(); controls.update(); };

/* ---------- bucle ---------- */
function resize(){ aspect=innerWidth/innerHeight; cam.left=-D*aspect; cam.right=D*aspect; cam.top=D; cam.bottom=-D; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener("resize",resize); resize();
let t0=performance.now();
function loop(now){
  const dt=(now-t0)/1000; t0=now;
  if(spin) root.rotation.y += dt*0.12;
  // parpadeo sutil de pantallas
  if(screensOn){ const p=0.95+Math.sin(now*0.002)*0.08; screens.forEach(s=>s.material.emissiveIntensity=1.05*p); }
  controls.update(); renderer.render(scene,cam); updateLabels();
  requestAnimationFrame(loop);
}
document.getElementById("loading").style.display="none";
requestAnimationFrame(loop);
</script>
</body>
</html>
