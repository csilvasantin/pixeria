<!doctype html><meta charset="utf-8"><title>Trinity · Montaje de combo</title><style>body{background:#081016;color:#d5eee6;font:16px system-ui;padding:30px}video{max-width:700px;width:95%}button{padding:16px}pre{white-space:pre-wrap}</style><body><h1>Combo local · diez segundos</h1><p>Verificación con imagen y tono de prueba creados localmente. No llama a proveedores ni publica Stock.</p><button id="run">Probar montaje y recuperación</button><pre id="status">Preparado</pre><div id="result"></div><script type="module">
import {renderCombo} from '/assets/creativo-combo-render.mjs?v=creativo-20261018-15';
import {ComboRepository,runCombo} from '/assets/creativo-combo-store.mjs?v=creativo-20261018-15';
const $=id=>document.getElementById(id),repo=await ComboRepository.open(),spec={kind:'locucion',seconds:10,imagePrompt:'Fixture local · café · sin IA',audioText:'Tono local de prueba',voice:'chica',languages:['ESP'],orientation:'horizontal'};
function tone(){const frames=44100*2,bytes=new ArrayBuffer(44+frames*2),v=new DataView(bytes),str=(offset,s)=>[...s].forEach((c,i)=>v.setUint8(offset+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,36+frames*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,frames*2,true);for(let n=0;n<frames;n++)v.setInt16(44+n*2,Math.sin(2*Math.PI*440*n/44100)*4000,true);return new Blob([bytes],{type:'audio/wav'});}
async function inspect(job){const output=await repo.media(job.id),video=document.createElement('video');video.controls=true;video.src=URL.createObjectURL(output);$('result').replaceChildren(video);await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=reject;});if(Math.abs(video.duration-10)>.1||video.videoWidth!==1920||video.videoHeight!==1080)throw Error('Dimensiones o duración incorrectas');const ctx=new AudioContext(),buffer=await ctx.decodeAudioData(await output.arrayBuffer()),channel=buffer.getChannelData(0),peak=(from,to)=>{let m=0;for(let n=Math.floor(from*buffer.sampleRate);n<Math.min(channel.length,to*buffer.sampleRate);n++)m=Math.max(m,Math.abs(channel[n]));return m;};if(peak(0,1)<.01||peak(5,9)>.005)throw Error('Audio ausente o relleno incorrecto');await ctx.close();$('status').textContent='PASS · MP4 real 1920 × 1080 · '+video.duration.toFixed(2)+' s · audio presente · silencio de relleno · salida recuperable\nJob: '+job.id;}
$('run').onclick=async()=>{try{$('run').disabled=true;const job=await repo.create(spec);let calls=0;await runCombo(job,repo,{preflight:async()=>'',generateImage:async()=>{calls++;const c=document.createElement('canvas');c.width=960;c.height=540;const x=c.getContext('2d');x.fillStyle='#062c27';x.fillRect(0,0,960,540);x.fillStyle='#c5ffe0';x.font='bold 64px system-ui';x.fillText('COMBO · 10 segundos',80,240);return await new Promise(r=>c.toBlob(r));},submitAudio:async()=>{calls++;return {blob:tone()};},assemble:(j,i,a)=>renderCombo(j,i,a,{notify:info=>$('status').textContent=info.phase+' '+Math.round((info.progress||0)*100)+'%'})});await inspect(await repo.get(job.id));await runCombo(await repo.get(job.id),repo,{preflight:()=>{throw Error('Repetición');}});if(calls>2)throw Error('Componentes duplicados');sessionStorage.setItem('combo-test-job',job.id);}catch(e){$('status').textContent='FAIL · '+e.message;console.error(e);}finally{$('run').disabled=false;}};
const previous=sessionStorage.getItem('combo-test-job');if(previous){const job=await repo.get(previous);if(job?.state==='complete')await inspect(job);}
</script>
</body>
